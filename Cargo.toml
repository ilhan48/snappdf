[package]
name = "snappdf"
version = "0.2.0"
edition = "2021"
description = "Link -> güzel PDF: tarayıcısız, reklam/izleyici temizliğini adblock motoruyla yapan PDF üretici"

[dependencies]
adblock = { version = "0.13", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling", "addr"] }
anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
ego-tree = "0.10"
genpdf = { version = "0.2", features = ["images"] }
image = { version = "0.23", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# Kayıpsız/alfalı WebP: image 0.23 yalnızca kayıplı VP8 çözebildiği için ek kod çözücü.
image-webp = "0.2"
lopdf = "0.26"
# PDF'e gömülecek fontları yalnızca kullanılan karakterlere indirger.
subsetter = { version = "0.2", default-features = false }
ttf-parser = "0.25"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "gzip", "charset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scraper = "0.24"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[profile.release]
lto = "thin"
strip = true
